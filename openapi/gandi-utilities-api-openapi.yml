openapi: 3.2.0
info:
  title: Gandi LiveDNS Utilities API
  description: The Gandi LiveDNS API provides DNS management capabilities for domains managed by Gandi, including DNS record management, DNSSEC, zone transfers, and TSIG key management.
  version: '5.0'
  contact:
    name: Gandi Support
    url: https://www.gandi.net/
  license:
    name: Proprietary
servers:
- url: https://api.gandi.net/v5/livedns
  description: Production
- url: https://api.sandbox.gandi.net/v5/livedns
  description: Sandbox
security:
- apiKey: []
tags:
- name: Utilities
  description: Utility endpoints for record types.
paths:
  /dns/rrtypes:
    get:
      summary: List record types
      description: List all accepted DNS record types.
      tags:
      - Utilities
      responses:
        '200':
          description: List of supported DNS record types.
      operationId: getDnsRrtypes
      x-operation-id-source: derived
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: Use the format `Apikey YOUR_API_KEY`.
